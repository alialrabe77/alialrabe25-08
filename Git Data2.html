<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 8 - JSON Loop in Sections</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      border: 1px solid #080606;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
    img {
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      max-width: 150px;
      display: block;
    }
    .section {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>Get Data from Public API</h2>
  <div id="container"></div>

  <script>
    async function loadData() {
      // 1. Fetch JSON data from the actual API endpoint (not an image URL)
      const response = await fetch("https://fakestoreapi.com/products");
      const data = await response.json();

      // 2. Use the real container that exists in the HTML
      const container = document.getElementById("container");
      container.innerHTML = "";

      // 3. Loop through the fetched data and build a section per item
      data.forEach(product => {
        const section = document.createElement("section");
        section.className = "card section";
        section.innerHTML = `
          <img src="${product.image}" alt="${product.title}">
          <h3>${product.title}</h3>
          <p><strong>Price:</strong> $${product.price}</p>
          <p><strong>Category:</strong> ${product.category}</p>
        `;
        container.appendChild(section);
      });
    }

    // 4. Actually call the function
    loadData();
  </script>
</body>
</html>
